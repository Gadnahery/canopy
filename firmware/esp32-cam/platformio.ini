; PlatformIO project for the ESP32-CAM canopy densitometer.
;   Build : pio run
;   Upload: pio run -t upload
;   Serial: pio device monitor
; The .ino + secrets.h sit in this folder (src_dir = .), so the sketch stays
; openable in the Arduino IDE too.

[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_port = COM13
monitor_port = COM13
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    bblanchon/ArduinoJson@^6.21.5
