; PlatformIO project for the ESP32 (NodeMCU-32S) controller: button + LCD.
;   Build : pio run
;   Upload: pio run -t upload        (auto-detects the port; add -upload_port if needed)
;   Serial: pio device monitor
; secrets.h holds the WiFi + Supabase credentials (copy secrets.h.example).

[platformio]
src_dir = .

[env:nodemcu-32s]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
    bblanchon/ArduinoJson@^6.21.5
